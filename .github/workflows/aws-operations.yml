name: AWS operations
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected environment
        type: choice
        options: [staging, production]
        default: staging
      action:
        description: Cleanup stops application resources and preserves all data
        type: choice
        options: [status, logs, redeploy, cleanup]
        default: status
      image_sha:
        description: Redeploy requires an existing immutable full-SHA artifact
        type: string
        default: ''
      image_digest:
        description: Exact promoted sha256 digest required for production redeploy
        type: string
        default: ''
      stack_confirmation:
        description: Cleanup requires the exact namespace-environment-app stack name
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: aws-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  operate:
    if: >-
      github.repository == 'SahilWikhe/IVR_POC' &&
      github.ref == 'refs/heads/main' && vars.AWS_OPERATIONS_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ENVIRONMENT: ${{ inputs.environment }}
      AWS_DEPLOYMENT_READY: 'true'
      AWS_EXPECTED_IMAGE_DIGEST: ${{ inputs.image_digest }}
      OPERATION: ${{ inputs.action }}
      TARGET_SHA: ${{ inputs.image_sha }}
      STACK_CONFIRMATION: ${{ inputs.stack_confirmation }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_NAMESPACE: ${{ vars.AWS_NAMESPACE }}
      AWS_CLOUDFORMATION_ROLE_ARN: ${{ vars.AWS_CLOUDFORMATION_ROLE_ARN }}
      AWS_RUNTIME_BOUNDARY_ARN: ${{ vars.AWS_RUNTIME_BOUNDARY_ARN }}
      AWS_APP_DOMAIN: ${{ vars.AWS_APP_DOMAIN }}
      AWS_VOICE_DOMAIN: ${{ vars.AWS_VOICE_DOMAIN }}
      AWS_PUBLIC_HOSTED_ZONE_ID: ${{ vars.AWS_PUBLIC_HOSTED_ZONE_ID }}
      AWS_CERTIFICATE_ARN: ${{ vars.AWS_CERTIFICATE_ARN }}
      AWS_OIDC_ISSUER: ${{ vars.AWS_OIDC_ISSUER }}
      AWS_OIDC_CLIENT_ID: ${{ vars.AWS_OIDC_CLIENT_ID }}
      AWS_API_SECRET_ARN: ${{ vars.AWS_API_SECRET_ARN }}
      AWS_VOICE_SECRET_ARN: ${{ vars.AWS_VOICE_SECRET_ARN }}
      AWS_WORKER_SECRET_ARN: ${{ vars.AWS_WORKER_SECRET_ARN }}
      AWS_MIGRATION_SECRET_ARN: ${{ vars.AWS_MIGRATION_SECRET_ARN }}
      AWS_VOICE_TENANT_ID: ${{ vars.AWS_VOICE_TENANT_ID }}
      AWS_TWILIO_ACCOUNT_SID: ${{ vars.AWS_TWILIO_ACCOUNT_SID }}
      AWS_TWILIO_PHONE_NUMBER: ${{ vars.AWS_TWILIO_PHONE_NUMBER }}
      AWS_LIVE_VOICE_ENABLED: ${{ vars.AWS_LIVE_VOICE_ENABLED }}
      AWS_VOICE_ACTIONS_ENABLED: ${{ vars.AWS_VOICE_ACTIONS_ENABLED }}
      AWS_VOICE_TRANSFERS_ENABLED: ${{ vars.AWS_VOICE_TRANSFERS_ENABLED }}
      AWS_STATUS_READER_ENABLED: ${{ vars.AWS_STATUS_READER_ENABLED }}
      AWS_RECOVERY_INSTALLATION_ID: ${{ vars.AWS_RECOVERY_INSTALLATION_ID }}
      AWS_RECOVERY_EPOCH: ${{ vars.AWS_RECOVERY_EPOCH }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate operator intent before assuming AWS role
        run: |
          python infra/aws/scripts/validate.py
          if [ "$OPERATION" = redeploy ]; then
            python3 -c 'import os,re; assert re.fullmatch("[a-f0-9]{40}",os.environ["TARGET_SHA"]), "Use a full lowercase commit SHA"'
            git merge-base --is-ancestor "$TARGET_SHA" refs/remotes/origin/main
            if [ "$AWS_ENVIRONMENT" = production ]; then
              echo 'Production redeployment remains code-gated.'
              exit 1
            fi
          fi
          if [ "$OPERATION" = cleanup ]; then
            python3 -c 'import os; assert os.environ["STACK_CONFIRMATION"] == os.environ["AWS_NAMESPACE"]+"-"+os.environ["AWS_ENVIRONMENT"]+"-app", "Type the exact application stack name"'
          fi
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-duration-seconds: 3600
          role-session-name: hostline-ops-${{ github.run_id }}
          unset-current-credentials: true
          mask-aws-account-id: true
      - name: Execute bounded operation
        run: |
          if [ "$OPERATION" = redeploy ]; then
            python infra/aws/scripts/deploy.py --sha "$TARGET_SHA" --redeploy
          elif [ "$OPERATION" = cleanup ]; then
            python infra/aws/scripts/operations.py cleanup --confirm-stack "$STACK_CONFIRMATION"
          elif [ "$OPERATION" = status ] || [ "$OPERATION" = logs ]; then
            python infra/aws/scripts/operations.py "$OPERATION"
          else
            echo 'Unsupported operation.'
            exit 1
          fi
